<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0d1b3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#001f5b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6fb;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#00c6fb;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#005bea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#005bea;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6fb" />
      <stop offset="100%" style="stop-color:#005bea" />
    </linearGradient>
    <linearGradient id="oktaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c6fb" />
      <stop offset="100%" style="stop-color:#0062ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="circleGlow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00c6fb;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#00c6fb;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="circleGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#005bea;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#005bea;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>

  <!-- Grid pattern -->
  <g opacity="0.07">
    <line x1="0" y1="80" x2="1200" y2="80" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1200" y2="320" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="150" y1="0" x2="150" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="750" y1="0" x2="750" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
    <line x1="1050" y1="0" x2="1050" y2="400" stroke="#00c6fb" stroke-width="0.5"/>
  </g>

  <!-- Glow orbs -->
  <ellipse cx="200" cy="200" rx="200" ry="200" fill="url(#circleGlow1)"/>
  <ellipse cx="1000" cy="200" rx="200" ry="200" fill="url(#circleGlow2)"/>

  <!-- SOURCE ORG box (left) -->
  <rect x="60" y="130" width="220" height="140" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.8"/>
  <rect x="60" y="130" width="220" height="140" rx="12" fill="#00c6fb" fill-opacity="0.05"/>
  <!-- Org icon -->
  <circle cx="170" cy="172" r="22" fill="none" stroke="#00c6fb" stroke-width="1.5" filter="url(#glow)"/>
  <text x="170" y="178" font-family="monospace" font-size="18" fill="#00c6fb" text-anchor="middle" filter="url(#glow)">🏢</text>
  <text x="170" y="210" font-family="'Courier New', monospace" font-size="13" fill="#00c6fb" text-anchor="middle" font-weight="bold" letter-spacing="1">SOURCE ORG</text>
  <text x="170" y="228" font-family="'Courier New', monospace" font-size="10" fill="#7eb8d4" text-anchor="middle">Engineering · Marketing</text>
  <text x="170" y="248" font-family="'Courier New', monospace" font-size="10" fill="#7eb8d4" text-anchor="middle">5 Users · 2 Groups</text>

  <!-- Arrow / connection line in middle -->
  <line x1="290" y1="200" x2="450" y2="200" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Arrow head -->
  <polygon points="450,193 465,200 450,207" fill="#00c6fb" filter="url(#glow)"/>

  <!-- CENTER: sync icon -->
  <circle cx="600" cy="200" r="55" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="600" cy="200" r="40" fill="#00c6fb" fill-opacity="0.08"/>
  <!-- Sync arrows -->
  <path d="M580,185 A25,25 0 1,1 605,225" stroke="#00c6fb" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="578,172 585,186 572,186" fill="#00c6fb" filter="url(#glow)"/>
  <path d="M620,215 A25,25 0 1,1 595,175" stroke="#005bea" stroke-width="2.5" fill="none" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="622,228 615,214 628,214" fill="#005bea" filter="url(#glow)"/>
  <text x="600" y="248" font-family="'Courier New', monospace" font-size="9" fill="#7eb8d4" text-anchor="middle" letter-spacing="1">GROUP PUSH RULES</text>

  <!-- Arrow right side -->
  <line x1="660" y1="200" x2="820" y2="200" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="6,4"/>
  <polygon points="820,193 835,200 820,207" fill="#005bea" filter="url(#glow)"/>

  <!-- TARGET ORG box (right) -->
  <rect x="840" y="130" width="220" height="140" rx="12" fill="none" stroke="#005bea" stroke-width="1.5" opacity="0.8"/>
  <rect x="840" y="130" width="220" height="140" rx="12" fill="#005bea" fill-opacity="0.05"/>
  <circle cx="950" cy="172" r="22" fill="none" stroke="#005bea" stroke-width="1.5" filter="url(#glow)"/>
  <text x="950" y="178" font-family="monospace" font-size="18" fill="#4d9fff" text-anchor="middle" filter="url(#glow)">🏛️</text>
  <text x="950" y="210" font-family="'Courier New', monospace" font-size="13" fill="#4d9fff" text-anchor="middle" font-weight="bold" letter-spacing="1">TARGET ORG</text>
  <text x="950" y="228" font-family="'Courier New', monospace" font-size="10" fill="#7eb8d4" text-anchor="middle">Engineering · Marketing</text>
  <text x="950" y="248" font-family="'Courier New', monospace" font-size="10" fill="#7eb8d4" text-anchor="middle">Auto-synced · Rule-based</text>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#accentGrad)"/>
  <!-- Bottom accent line -->
  <rect x="0" y="397" width="1200" height="3" fill="url(#accentGrad)"/>

  <!-- Main title -->
  <text x="600" y="68" font-family="'Georgia', serif" font-size="36" fill="white" text-anchor="middle" font-weight="bold" letter-spacing="3" filter="url(#softglow)">OKTA ORG2ORG</text>
  <text x="600" y="95" font-family="'Courier New', monospace" font-size="13" fill="url(#accentGrad)" text-anchor="middle" letter-spacing="4">USER PROVISIONING &amp; GROUP SYNC</text>

  <!-- Bottom labels -->
  <text x="600" y="360" font-family="'Courier New', monospace" font-size="11" fill="#4a6fa5" text-anchor="middle" letter-spacing="2">IDENTITY · AUTOMATION · ZERO-TRUST</text>

  <!-- Corner decorations -->
  <rect x="20" y="20" width="30" height="2" fill="#00c6fb" opacity="0.6"/>
  <rect x="20" y="20" width="2" height="30" fill="#00c6fb" opacity="0.6"/>
  <rect x="1150" y="20" width="30" height="2" fill="#005bea" opacity="0.6"/>
  <rect x="1178" y="20" width="2" height="30" fill="#005bea" opacity="0.6"/>
  <rect x="20" y="378" width="30" height="2" fill="#00c6fb" opacity="0.6"/>
  <rect x="20" y="350" width="2" height="30" fill="#00c6fb" opacity="0.6"/>
  <rect x="1150" y="378" width="30" height="2" fill="#005bea" opacity="0.6"/>
  <rect x="1178" y="350" width="2" height="30" fill="#005bea" opacity="0.6"/>
</svg>
