  <text x="730" y="355" font-family="'Courier New', monospace" font-size="8" fill="#6b7280" text-anchor="middle">By rule: Push Marketing to Target</text>
  <text x="730" y="370" font-family="'Courier New', monospace" font-size="8" fill="#6b7280" text-anchor="middle">Managed automatically 🤖</text>

