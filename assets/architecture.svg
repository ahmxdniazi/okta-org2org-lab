  <text x="108" y="138" font-family="'Courier New', monospace" font-size="11" fill="white" font-weight="bold">Test Users (5)</text>
  <text x="85" y="158" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">• Sarmad Farooq  · Engineering</text>
  <text x="85" y="172" font-family="'Courier New', monospace" font-size="9" fill="#94a3b8">• Ayesha Sajid   · Mktg + Eng</text>
