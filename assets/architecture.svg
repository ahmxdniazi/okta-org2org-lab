  <text x="645" y="283" font-family="monospace" font-size="14" fill="#0ea5e9">📁</text>
  <text x="668" y="283" font-family="'Courier New', monospace" font-size="11" fill="white" font-weight="bold">TargetOrg-Marketing</text>
  <text x="640" y="307" font-family="'Courier New', monospace" font-size="9" fill="#7dd3fc">✓ Ayesha Sajid</text>
